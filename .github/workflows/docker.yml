name: Docker CI

on:
  push:
    branches: [main, exp]
  pull_request:
    branches: [main, exp]
  workflow_dispatch:

jobs:
  docker-build:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nlp-mlops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image imports
        run: |
          docker run --rm --entrypoint python nlp-mlops:ci \
            -c "import src.api.main; print('Application import passed')"