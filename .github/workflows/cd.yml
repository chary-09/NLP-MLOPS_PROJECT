name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --tag sentiment-analysis:latest .

      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint python sentiment-analysis:latest \
            -c "import src.api.main; print('App imported successfully')"

